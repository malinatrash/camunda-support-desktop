[package]
name = "camunda-support"
description = "Desktop console for Camunda support operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
camunda-core.workspace = true
dirs.workspace = true
futures.workspace = true
gpui-kit.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[workspace]
members = ["crates/camunda-core"]
resolver = "3"

[workspace.package]
version = "2.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["malinatrash"]
publish = false

[workspace.dependencies]
camunda-core = { path = "crates/camunda-core" }
chrono = { version = "0.4", features = ["clock"] }
dirs = "6"
futures = "0.3"
futures-util = "0.3"
gpui-kit = "0.9"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "process"] }
urlencoding = "2"
winreg = "0.55"
winresource = "0.1"
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Зависимости (GPUI, рендер, текст) оптимизируются и в dev: иначе `cargo run` заметно тормозит при анимации.
[profile.dev.package."*"]
opt-level = 3
