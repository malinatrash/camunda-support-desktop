name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce and what you expected instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the status bar, e.g. v2.5.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Camunda version
      description: e.g. 7.19.0
