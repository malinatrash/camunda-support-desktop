name: Feature request
description: Suggest an idea for a support workflow
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you do today, and what is slow or risky about it?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How the app could help.
