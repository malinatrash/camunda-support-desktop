name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 MSI and EXE
            os: windows-2022
            bundles: msi,nsis
            artifact: camunda-support-windows
            glob: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS ARM64 DMG
            os: macos-15
            bundles: dmg
            artifact: camunda-support-macos-arm64
            glob: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Ubuntu x64 DEB
            os: ubuntu-24.04
            bundles: deb
            artifact: camunda-support-linux-x64
            glob: src-tauri/target/release/bundle/deb/*.deb

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Apply release version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"

      - name: Check frontend
        shell: bash
        run: |
          pnpm check
          pnpm test

      - name: Test Rust
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.run_id }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          while IFS= read -r -d '' file; do
            directory="$(dirname "$file")"
            name="$(basename "$file")"
            normalized="${name// /.}"
            if [[ "$name" != "$normalized" ]]; then
              mv "$file" "$directory/$normalized"
            fi
          done < <(find . -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \) -print0)

          find . -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mapfile -d '' assets < <(
            find dist -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \) -print0
          )
          assets+=("dist/SHA256SUMS.txt")

          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Camunda Support ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Windows x64, macOS ARM64 and Ubuntu x64 installers built with Tauri. Packages are unsigned."
